name: Helm Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'environments/**'
      - 'regions/**'
      - 'clusters/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.extract.outputs.app }}
      env: ${{ steps.extract.outputs.env }}
      region: ${{ steps.extract.outputs.region }}
      cluster: ${{ steps.extract.outputs.cluster }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Dynamic Values
        id: extract
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          echo "Changed files:"
          echo "$CHANGED"

          APP=$(echo "$CHANGED" | grep -oE 'apps/[^/]+' | head -n1 | cut -d'/' -f2)
          ENV=$(echo "$CHANGED" | grep -oE 'environments/[^/]+' | head -n1 | cut -d'/' -f2)
          REGION=$(echo "$CHANGED" | grep -oE 'regions/[^/]+' | head -n1 | cut -d'/' -f2)
          CLUSTER=$(echo "$CHANGED" | grep -oE 'clusters/[^/]+' | head -n1 | cut -d'/' -f2)

          # Fallback defaults (important)
          ENV=${ENV:-dev}
          REGION=${REGION:-us-east-1}
          CLUSTER=${CLUSTER:-cluster1}

          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT

  deploy:
    needs: detect
    runs-on: ubuntu-latest

    environment: ${{ needs.detect.outputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.detect.outputs.region }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.detect.outputs.cluster }} \
            --region ${{ needs.detect.outputs.region }}

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install ${{ needs.detect.outputs.app }} \
            apps/${{ needs.detect.outputs.app }}/helm-chart \
            -f apps/${{ needs.detect.outputs.app }}/${{ needs.detect.outputs.app }}.yaml \
            -f environments/${{ needs.detect.outputs.env }}/${{ needs.detect.outputs.app }}.yaml \
            -f regions/${{ needs.detect.outputs.region }}/${{ needs.detect.outputs.app }}.yaml \
            -f clusters/${{ needs.detect.outputs.cluster }}/${{ needs.detect.outputs.app }}.yaml \
            --atomic --timeout 5m






