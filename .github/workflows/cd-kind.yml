name: Helm Deployment (Local KIND)

on:
  workflow_call:
    inputs:
      deployment-repo:
        required: true
        type: string
      app:
        required: true
        type: string
      env:
        required: true
        type: string
      region:
        required: true
        type: string
      latest-chart:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      KUBECONFIG_DATA:
        required: true

jobs:
  deploy:
    runs-on: self-hosted   # 👈 IMPORTANT (local runner)

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4
        with:
          repository: ${{inputs.deployment-repo}}
          token: ${{ secrets.GH_PAT }}
          path: deployment-repo

      - name: Install Helm
        uses: azure/setup-helm@v4

      # 🔥 Setup kubeconfig for kind
      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config

      - name: Verify kind cluster
        run: |
          kubectl config use-context kind-kind
          kubectl get nodes

      # 🔥 Pull latest image locally
      - name: Pull Docker image
        run: |
          docker pull yourdockerhubusername/my-app:${{ inputs.latest-chart }}

      # 🔥 Load image into kind
      - name: Load image into kind
        run: |
          kind load docker-image yourdockerhubusername/my-app:${{ inputs.latest-chart }}

      - name: Deploy using Helm
        run: |
          cd deployment-repo
          helm upgrade --install ${{ inputs.app }} ./apps/${{ inputs.app }}/helm-chart/ \
            --namespace ${{ inputs.env }} \
            --create-namespace \
            -f ./apps/${{ inputs.app }}/${{ inputs.app }}.yaml \
            -f ./environments/${{ inputs.env }}/${{ inputs.app }}.yaml
